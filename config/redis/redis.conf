# Spec 034 / ADR-039 managed Redis configuration.
# Private-network reachability is preserved through the container network;
# host exposure is controlled by the Compose port mapping (loopback only).
bind 0.0.0.0
protected-mode yes
port 6379

# ACL persistence: users are rendered at container start from environment
# secrets (see entrypoint.sh); the default user is disabled there by default.
aclfile /run/redis-acl/users.acl
acllog-max-len 256

# Persistence posture is unchanged from the accepted baseline (Spec 032).
appendonly no
save 3600 1 300 100 60 10000
maxmemory-policy noeviction
dir /data

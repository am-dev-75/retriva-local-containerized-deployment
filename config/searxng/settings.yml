# SearXNG configuration for the internal Retriva deployment.
#
# Mounted read-only at /etc/searxng/settings.yml in the retriva-searxng
# container.  Based on SearXNG defaults (use_default_settings: true) with:
# - JSON output enabled (required by SearxngSearchProvider);
# - a conservative, administrator-controlled upstream engine set for
#   automated company research (see docs/local-deployment.md);
# - the secret key injected from the environment (SEARXNG_SECRET) — never
#   committed to the repository.
#
# The limiter is intentionally DISABLED: this instance is reachable only on
# the internal Docker network by trusted Retriva components, and Retriva Web
# Research applies its own concurrency/interval limits.  The SearXNG limiter
# would additionally require Valkey and correct forwarded-header handling
# (see ADR-014 in retriva-crm-assistant/docs/adr/).
use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

engines:
  # Conservative initial engine set for company/technical research.
  # NOTE: `use_default_settings: true` MERGES the default engine list, so
  # every default-enabled engine not explicitly disabled here also runs.
  # The entries below disable the default-enabled general-category engines
  # that add upstream load without value for company research (translation
  # and currency answerers), plus the bot-detection-prone web engines.
  # Verified against the running instance's /config endpoint.
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
    timeout: 6.0   # measured: ~400ms standalone but 3s default times out
                    # under multi-engine fan-out from this network
  - name: wikidata
    disabled: false
    timeout: 6.0   # same rationale as wikipedia
  - name: openstreetmap
    disabled: false
  - name: bing
    disabled: true   # frequent bot-detection challenges for datacenter IPs
  - name: bing images
    disabled: true
  - name: bing news
    disabled: true
  - name: bing videos
    disabled: true
  - name: google
    disabled: true   # aggressive CAPTCHA for datacenter IPs
  - name: currency
    disabled: true   # default-enabled; irrelevant to company research
  - name: lingva
    disabled: true   # translation answerer
  - name: dictzone
    disabled: true   # translation answerer
  - name: mymemory translated
    disabled: true   # translation answerer
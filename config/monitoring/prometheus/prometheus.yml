# Spec 035 / ADR-040 — Prometheus configuration for the canonical Retriva
# monitoring stack (deployment repository). Private network only; no host ports
# are published by the committed Compose configuration.
#
# Every hostname below MUST be a canonical Compose service name (or a declared
# network alias) of this repository's docker-compose.yml. The deterministic
# topology-parity tests in tests/test_monitoring_stack.py fail otherwise.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/redis-security.rules.yml
  - /etc/prometheus/rules/monitoring-self.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["retriva-alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["retriva-alertmanager:9093"]

  - job_name: redis-monitor
    static_configs:
      - targets: ["retriva-redis-monitor-exporter:9187"]

  - job_name: pg-monitor
    metrics_path: /metrics.txt
    static_configs:
      - targets: ["retriva-pg-monitor-exporter:9188"]

name: retriva-local

networks:
  retriva-net:
    name: retriva-local-net
    driver: bridge

volumes:
  # Spec 035 / ADR-040 monitoring stack
  prometheus_data:
  alertmanager_data:
  alert_sink_data:
  qdrant_storage:
  retriva_core_storage:
  retriva_gateway_storage:
  mediawiki_connector_state:
  mediawiki_connector_2_state:
  mediawiki_local_config:
  mediawiki_local_db_data:
  email_agent_connector_state:
  whisper_models:
  redis_data:
  apprise_config:
  messaging_state:
  retriva_pg_data:
  retriva_pgadmin_data:

services:

  # --- Spec 035 / ADR-040: canonical monitoring stack (profile "monitoring") ---
  # Private network only (no host publication). Pinned images. Read-only
  # collectors using rtrv-monitor (Redis) and a least-privilege PostgreSQL role.
  # Deployment/rollback and runbooks: docs/monitoring-runbook.md.
  retriva-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    container_name: retriva-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  retriva-alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    container_name: retriva-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  retriva-alert-sink:
    image: ${PYTHON_ALPINE_IMAGE:-python:3.12-alpine}
    container_name: retriva-alert-sink
    restart: unless-stopped
    profiles: ["monitoring"]
    command: python /opt/monitoring/alert_sink.py
    environment:
      TZ: ${TZ:-UTC}
      SINK_PORT: "9099"
      SINK_LOG: /sink/alerts.log
    volumes:
      - ./config/monitoring/exporters/alert_sink.py:/opt/monitoring/alert_sink.py:ro
      - alert_sink_data:/sink
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9099/healthz',timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  retriva-redis-monitor-exporter:
    image: ${PYTHON_ALPINE_IMAGE:-python:3.12-alpine}
    container_name: retriva-redis-monitor-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command: python /opt/monitoring/redis_monitor_exporter.py
    environment:
      TZ: ${TZ:-UTC}
      REDIS_MONITOR_HOST: redis
      REDIS_MONITOR_PORT: "6379"
      REDIS_MONITOR_USERNAME: rtrv-monitor
      REDIS_MONITOR_PASSWORD: ${REDIS_MONITOR_PASSWORD:?set REDIS_MONITOR_PASSWORD in the env file}
      EXPORTER_PORT: "9187"
      POLL_INTERVAL_SECONDS: ${REDIS_EXPORTER_POLL_SECONDS:-15}
    volumes:
      - ./config/monitoring/exporters/redis_monitor_exporter.py:/opt/monitoring/redis_monitor_exporter.py:ro
    networks:
      - retriva-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9187/healthz',timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  retriva-pg-monitor-exporter:
    build:
      context: ./config/monitoring/exporters
      dockerfile: Dockerfile.pg-monitor
    image: ${PG_MONITOR_IMAGE:-retriva-pg-monitor-exporter:local}
    container_name: retriva-pg-monitor-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "/opt/monitoring/pg_monitor_collector.sh"]
    environment:
      TZ: ${TZ:-UTC}
      PGHOST: retriva-postgres
      PGPORT: "5432"
      PGDATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      PGUSER: ${RETRIVA_PG_MONITOR_USER:?set RETRIVA_PG_MONITOR_USER in the env file}
      PGPASSWORD: ${RETRIVA_PG_MONITOR_PASSWORD:?set RETRIVA_PG_MONITOR_PASSWORD in the env file}
      PGOPTIONS: -c statement_timeout=5000
      METRICS_PORT: "9188"
      PG_POLL_INTERVAL_SECONDS: ${PG_MONITOR_POLL_SECONDS:-15}
    volumes:
      - ./config/monitoring/exporters/pg_monitor_collector.sh:/opt/monitoring/pg_monitor_collector.sh:ro
    networks:
      - retriva-net
    depends_on:
      retriva-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9188/metrics.txt | grep -q retriva_pg_nonterminal_jobs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: retriva-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      TZ: ${TZ:-UTC}
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY_DISABLED: "${QDRANT_TELEMETRY_DISABLED:-true}"
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  tika:
    image: ${TIKA_IMAGE:-apache/tika:latest-full}
    container_name: retriva-tika
    restart: unless-stopped
    ports:
      - "${TIKA_BIND_ADDR:-127.0.0.1}:${TIKA_PORT:-9998}:9998"
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9998' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  whisper-init:
    image: alpine:latest
    container_name: retriva-whisper-init
    command: >
      sh -c "
      if [ ! -f /models/${WHISPER_MODEL:-ggml-base.en.bin} ]; then
        echo 'Downloading Whisper model...';
        wget -q -O /models/${WHISPER_MODEL:-ggml-base.en.bin} https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL:-ggml-base.en.bin};
      else
        echo 'Whisper model already exists.';
      fi"
    volumes:
      - whisper_models:/models

  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/ggerganov/whisper.cpp:main}
    container_name: retriva-whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8080}:${WHISPER_PORT:-8080}"
    command: /app/build/bin/whisper-server -m /models/${WHISPER_MODEL:-ggml-base.en.bin} --host 0.0.0.0 --port ${WHISPER_PORT:-8080}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - whisper_models:/models
    depends_on:
      whisper-init:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # Spec 034 / ADR-039: least-privilege Redis ACLs. Users are rendered from
  # environment secrets at container start; the default user is disabled
  # unless REDIS_ALLOW_UNAUTHENTICATED_DEFAULT=yes (staged rollout only).
  # Host publication is loopback-only; service traffic uses the private
  # container network. See docs/redis-acl-runbook.md.
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: retriva-redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/redis/entrypoint.sh"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/entrypoint.sh:/etc/redis/entrypoint.sh:ro
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./config/redis/users.acl.template:/etc/redis/users.acl.template:ro
    environment:
      TZ: ${TZ:-UTC}
      REDIS_BROKER_PASSWORD: ${REDIS_BROKER_PASSWORD:?set REDIS_BROKER_PASSWORD in the env file}
      REDIS_RESULTS_PASSWORD: ${REDIS_RESULTS_PASSWORD:?set REDIS_RESULTS_PASSWORD in the env file}
      REDIS_MONITOR_PASSWORD: ${REDIS_MONITOR_PASSWORD:?set REDIS_MONITOR_PASSWORD in the env file}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?set REDIS_HEALTH_PASSWORD in the env file}
      REDIS_ALLOW_UNAUTHENTICATED_DEFAULT: ${REDIS_ALLOW_UNAUTHENTICATED_DEFAULT:-no}
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_HEALTH_PASSWORD\" redis-cli --user rtrv-health ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  retriva-ingestion:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ${RETRIVA_CORE_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_CORE_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_CORE_BUILD_TARGET:-base}
    image: ${RETRIVA_INGESTION_IMAGE:-retriva-ingestion:local}
    container_name: retriva-ingestion
    command: python -m retriva.ingestion_api --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      # Service wiring
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RETRIVA_DEFAULT_COLLECTION: ${RETRIVA_DEFAULT_COLLECTION:-retriva_chunks}
      TIKA_SERVER_URL: ${TIKA_SERVER_URL:-http://tika:9998}

      # --- OpenAI-compatible provider (default: OpenRouter) ----------------
      # Retriva core uses ONE key fanned out to every purpose via
      # model_post_init(), plus PER-PURPOSE base URLs and API keys. To
      # redirect ALL traffic to another provider, set LLM_PROVIDER_BASE_URL
      # in .env; it is used as the default for embeddings, vision, chat and
      # reranking below. Override any single purpose by setting its own
      # *_BASE_URL and/or *_API_KEY in .env.
      OPENROUTER_OPENAI_API_KEY: ${OPENAI_PROVIDER_API_KEY}
      # Per-purpose API keys (default to OPENAI_PROVIDER_API_KEY). Set these
      # when a *_BASE_URL above points to a provider that needs a different key.
      EMBEDDING_OPENAI_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      VISUAL_OPENAI_API_KEY: ${VISUAL_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      CHAT_OPENAI_API_KEY: ${CHAT_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      RETRIEVAL_RERANK_API_KEY: ${RETRIEVAL_RERANK_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      VISUAL_BASE_URL: ${VISUAL_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      RETRIEVAL_RERANK_BASE_URL: ${RETRIEVAL_RERANK_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      # Rerank provider selection (global, one setting for every KB/user):
      # "" or "openrouter" (default, Cohere-compatible /rerank) or "bedrock"
      # (Amazon Bedrock Rerank). With "bedrock", RETRIEVAL_RERANK_API_KEY is
      # ignored and credentials come from the standard AWS chain
      # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN, shared
      # config, or the workload IAM role).
      RETRIEVAL_RERANK_PROVIDER: ${RETRIEVAL_RERANK_PROVIDER:-}
      RETRIEVAL_RERANK_AWS_REGION: ${RETRIEVAL_RERANK_AWS_REGION:-}
      RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION: ${RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION:-false}
      RETRIEVAL_RERANK_ENFORCE_EU_REGION: ${RETRIEVAL_RERANK_ENFORCE_EU_REGION:-false}
      RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS: ${RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS:-}
      # --- Intent classification (Spec 001 Phase D; provider-agnostic,
      # mirroring the reranker pattern).  Disabled by default; NO default
      # model exists (never derived from CHAT_MODEL).  Canonical providers:
      # openrouter | bedrock.  Both mutually exclusive alternatives are
      # documented in .env.example; a deployment enables exactly one and
      # sets the dedicated service-auth token (must equal the gateway's
      # AGENT_INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN).
      INTENT_CLASSIFIER_ENABLED: ${INTENT_CLASSIFIER_ENABLED:-false}
      INTENT_CLASSIFIER_PROVIDER: ${INTENT_CLASSIFIER_PROVIDER:-}
      INTENT_CLASSIFIER_MODEL: ${INTENT_CLASSIFIER_MODEL:-}
      INTENT_CLASSIFIER_TIMEOUT_SECONDS: ${INTENT_CLASSIFIER_TIMEOUT_SECONDS:-10}
      INTENT_CLASSIFIER_MAX_RETRIES: ${INTENT_CLASSIFIER_MAX_RETRIES:-1}
      INTENT_CLASSIFIER_MAX_CONCURRENT_REQUESTS: ${INTENT_CLASSIFIER_MAX_CONCURRENT_REQUESTS:-8}
      INTENT_CLASSIFIER_MAX_INPUT_CHARS: ${INTENT_CLASSIFIER_MAX_INPUT_CHARS:-2000}
      INTENT_CLASSIFIER_MAX_REQUEST_BYTES: ${INTENT_CLASSIFIER_MAX_REQUEST_BYTES:-32768}
      INTENT_CLASSIFIER_RATE_LIMIT_PER_MINUTE: ${INTENT_CLASSIFIER_RATE_LIMIT_PER_MINUTE:-120}
      INTENT_CLASSIFIER_PROMPT_VERSION: ${INTENT_CLASSIFIER_PROMPT_VERSION:-1}
      INTENT_CLASSIFIER_REQUIRE_EU_RESIDENCY: ${INTENT_CLASSIFIER_REQUIRE_EU_RESIDENCY:-true}
      INTENT_CLASSIFIER_REQUIRE_ZDR: ${INTENT_CLASSIFIER_REQUIRE_ZDR:-true}
      INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN: ${INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN:-}
      # OpenRouter-specific (only when provider=openrouter).
      INTENT_CLASSIFIER_OPENROUTER_BASE_URL: ${INTENT_CLASSIFIER_OPENROUTER_BASE_URL:-https://eu.openrouter.ai/api/v1}
      INTENT_CLASSIFIER_OPENROUTER_API_KEY: ${INTENT_CLASSIFIER_OPENROUTER_API_KEY:-}
      INTENT_CLASSIFIER_OPENROUTER_REQUIRE_PARAMETERS: ${INTENT_CLASSIFIER_OPENROUTER_REQUIRE_PARAMETERS:-true}
      INTENT_CLASSIFIER_OPENROUTER_ALLOW_FALLBACKS: ${INTENT_CLASSIFIER_OPENROUTER_ALLOW_FALLBACKS:-true}
      INTENT_CLASSIFIER_OPENROUTER_DATA_COLLECTION: ${INTENT_CLASSIFIER_OPENROUTER_DATA_COLLECTION:-deny}
      INTENT_CLASSIFIER_OPENROUTER_ZDR: ${INTENT_CLASSIFIER_OPENROUTER_ZDR:-true}
      # Bedrock-specific (only when provider=bedrock).
      INTENT_CLASSIFIER_AWS_REGION: ${INTENT_CLASSIFIER_AWS_REGION:-eu-central-1}
      INTENT_CLASSIFIER_BEDROCK_INFERENCE_GEOGRAPHY: ${INTENT_CLASSIFIER_BEDROCK_INFERENCE_GEOGRAPHY:-eu}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3.5-27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-baai/bge-m3}
      VISUAL_MODEL: ${VISUAL_MODEL:-qwen/qwen3-vl-32b-instruct}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}

      # Local-dev behavior
      ENABLE_INTERNAL_PROFILER: ${ENABLE_INTERNAL_PROFILER:-true}
      LOG_LEVEL: ${CORE_LOG_LEVEL:-INFO}
      # ── Celery / Redis (Spec 034 / ADR-039 least-privilege identities) ──
      CELERY_BROKER_URL: "redis://rtrv-broker:${REDIS_BROKER_PASSWORD:?set REDIS_BROKER_PASSWORD in the env file}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://rtrv-results:${REDIS_RESULTS_PASSWORD:?set REDIS_RESULTS_PASSWORD in the env file}@redis:6379/1"
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-3}
      # --- GraphRAG ---
      GRAPH_ENABLED: ${GRAPH_ENABLED:-false}
      GRAPH_STORE_BACKEND: ${GRAPH_STORE_BACKEND:-sqlite}
      GRAPH_DEFAULT_RETRIEVAL_MODE: ${GRAPH_DEFAULT_RETRIEVAL_MODE:-vector}
      GRAPH_TRAVERSAL_MAX_DEPTH: ${GRAPH_TRAVERSAL_MAX_DEPTH:-2}
      GRAPH_TRAVERSAL_MAX_NODES: ${GRAPH_TRAVERSAL_MAX_NODES:-50}
      GRAPH_TRAVERSAL_MAX_EDGES: ${GRAPH_TRAVERSAL_MAX_EDGES:-100}
      GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD: ${GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD:-0.5}
      # --- Retriva Pro extensions ---
      RETRIVA_EXTENSIONS: ${RETRIVA_EXTENSIONS:-}
      # --- Web Research: internal SearXNG (ADR-014) ---
      CRM_SEARXNG_URL: ${CRM_SEARXNG_URL:-http://retriva-searxng:8080}
      CRM_PUBLIC_RESEARCH_PROVIDER: ${CRM_PUBLIC_RESEARCH_PROVIDER:-searxng}
      # --- Task LLM (for extensions: extraction, classification, summarization) ---
      TASK_BASE_URL: ${TASK_BASE_URL:-}
      TASK_MODEL: ${TASK_MODEL:-}
      TASK_OPENAI_API_KEY: ${TASK_API_KEY:-}
      TASK_SYSTEM_PROMPT: ${TASK_SYSTEM_PROMPT:-}
      # --- Session Document Processing ---
      SESSION_ATTACHMENT_MAX_SIZE: ${SESSION_ATTACHMENT_MAX_SIZE:-52428800}
      SESSION_ATTACHMENT_TTL_SECONDS: ${SESSION_ATTACHMENT_TTL_SECONDS:-86400}
      SESSION_ARTIFACT_TTL_SECONDS: ${SESSION_ARTIFACT_TTL_SECONDS:-172800}
    ports:
      - "${INGESTION_PORT:-8000}:8000"
    volumes:
      - retriva_core_storage:/app/storage
    depends_on:
      qdrant:
        condition: service_healthy
      tika:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Mandatory shared PostgreSQL: Core services start only after
      # successful Core migrations (Spec 024; ADR-029).
      retriva-pg-migrate:
        condition: service_completed_successfully
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${CORE_INTERNAL_PORT:-8000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  retriva-core:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ${RETRIVA_CORE_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_CORE_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_CORE_BUILD_TARGET:-base}
    image: ${RETRIVA_CORE_IMAGE:-retriva-core:local}
    container_name: retriva-core
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      # Service wiring
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RETRIVA_DEFAULT_COLLECTION: ${RETRIVA_DEFAULT_COLLECTION:-retriva_chunks}
      TIKA_SERVER_URL: ${TIKA_SERVER_URL:-http://tika:9998}

      # --- OpenAI-compatible provider (default: OpenRouter) ----------------
      # Retriva core uses ONE key fanned out to every purpose via
      # model_post_init(), plus PER-PURPOSE base URLs and API keys. To
      # redirect ALL traffic to another provider, set LLM_PROVIDER_BASE_URL
      # in .env; it is used as the default for embeddings, vision, chat and
      # reranking below. Override any single purpose by setting its own
      # *_BASE_URL and/or *_API_KEY in .env.
      OPENROUTER_OPENAI_API_KEY: ${OPENAI_PROVIDER_API_KEY}
      # Per-purpose API keys (default to OPENAI_PROVIDER_API_KEY). Set these
      # when a *_BASE_URL above points to a provider that needs a different key.
      EMBEDDING_OPENAI_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      VISUAL_OPENAI_API_KEY: ${VISUAL_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      CHAT_OPENAI_API_KEY: ${CHAT_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      RETRIEVAL_RERANK_API_KEY: ${RETRIEVAL_RERANK_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      VISUAL_BASE_URL: ${VISUAL_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      RETRIEVAL_RERANK_BASE_URL: ${RETRIEVAL_RERANK_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      # Rerank provider selection (global, one setting for every KB/user):
      # "" or "openrouter" (default, Cohere-compatible /rerank) or "bedrock"
      # (Amazon Bedrock Rerank). With "bedrock", RETRIEVAL_RERANK_API_KEY is
      # ignored and credentials come from the standard AWS chain
      # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN, shared
      # config, or the workload IAM role).
      RETRIEVAL_RERANK_PROVIDER: ${RETRIEVAL_RERANK_PROVIDER:-}
      RETRIEVAL_RERANK_AWS_REGION: ${RETRIEVAL_RERANK_AWS_REGION:-}
      RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION: ${RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION:-false}
      RETRIEVAL_RERANK_ENFORCE_EU_REGION: ${RETRIEVAL_RERANK_ENFORCE_EU_REGION:-false}
      RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS: ${RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3.5-27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-baai/bge-m3}
      VISUAL_MODEL: ${VISUAL_MODEL:-qwen/qwen3-vl-32b-instruct}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
      # --- Task LLM (for extensions: extraction, classification, summarization) ---
      TASK_BASE_URL: ${TASK_BASE_URL:-}
      TASK_MODEL: ${TASK_MODEL:-}
      TASK_OPENAI_API_KEY: ${TASK_API_KEY:-}
      TASK_SYSTEM_PROMPT: ${TASK_SYSTEM_PROMPT:-}
      # Optional system-prompt override (Retriva Pro / per-customer). When
      # non-empty, replaces the default grounded-QA prompt in retriva-core.
      # See .env.example for placeholder syntax.
      SYSTEM_PROMPT_OVERRIDE: ${SYSTEM_PROMPT_OVERRIDE:-}

      # Local-dev behavior
      ENABLE_INTERNAL_PROFILER: ${ENABLE_INTERNAL_PROFILER:-true}
      LOG_LEVEL: ${CORE_LOG_LEVEL:-INFO}
      # --- GraphRAG ---
      GRAPH_ENABLED: ${GRAPH_ENABLED:-false}
      GRAPH_STORE_BACKEND: ${GRAPH_STORE_BACKEND:-sqlite}
      GRAPH_DEFAULT_RETRIEVAL_MODE: ${GRAPH_DEFAULT_RETRIEVAL_MODE:-vector}
      GRAPH_TRAVERSAL_MAX_DEPTH: ${GRAPH_TRAVERSAL_MAX_DEPTH:-2}
      GRAPH_TRAVERSAL_MAX_NODES: ${GRAPH_TRAVERSAL_MAX_NODES:-50}
      GRAPH_TRAVERSAL_MAX_EDGES: ${GRAPH_TRAVERSAL_MAX_EDGES:-100}
      GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD: ${GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD:-0.5}
      # --- Retriva Pro extensions ---
      RETRIVA_EXTENSIONS: ${RETRIVA_EXTENSIONS:-}
      # --- Web Research: internal SearXNG (ADR-014) ---
      CRM_SEARXNG_URL: ${CRM_SEARXNG_URL:-http://retriva-searxng:8080}
      CRM_PUBLIC_RESEARCH_PROVIDER: ${CRM_PUBLIC_RESEARCH_PROVIDER:-searxng}
      # --- Session Document Processing ---
      SESSION_ATTACHMENT_MAX_SIZE: ${SESSION_ATTACHMENT_MAX_SIZE:-52428800}
      SESSION_ATTACHMENT_TTL_SECONDS: ${SESSION_ATTACHMENT_TTL_SECONDS:-86400}
      SESSION_ARTIFACT_TTL_SECONDS: ${SESSION_ARTIFACT_TTL_SECONDS:-172800}
    ports:
      - "${CORE_PORT:-8001}:8001"
    volumes:
      - retriva_core_storage:/app/storage
    depends_on:
      qdrant:
        condition: service_healthy
      tika:
        condition: service_healthy
      # Mandatory shared PostgreSQL: Core services start only after
      # successful Core migrations.
      retriva-pg-migrate:
        condition: service_completed_successfully
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${CORE_INTERNAL_PORT:-8001}/health || curl -fsS http://127.0.0.1:${CORE_INTERNAL_PORT:-8001}/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  retriva-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ${RETRIVA_CORE_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_CORE_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_CORE_BUILD_TARGET:-base}
    image: ${RETRIVA_INGESTION_IMAGE:-retriva-ingestion:local}
    container_name: retriva-worker
    command: python -m retriva.ingestion_api.worker
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      # Spec 034 / ADR-039: least-privilege broker (DB 0) and result (DB 1) identities.
      CELERY_BROKER_URL: "redis://rtrv-broker:${REDIS_BROKER_PASSWORD:?set REDIS_BROKER_PASSWORD in the env file}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://rtrv-results:${REDIS_RESULTS_PASSWORD:?set REDIS_RESULTS_PASSWORD in the env file}@redis:6379/1"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RETRIVA_DEFAULT_COLLECTION: ${RETRIVA_DEFAULT_COLLECTION:-retriva_chunks}
      TIKA_SERVER_URL: ${TIKA_SERVER_URL:-http://tika:9998}
      OPENROUTER_OPENAI_API_KEY: ${OPENAI_PROVIDER_API_KEY}
      # Per-purpose API keys (default to OPENAI_PROVIDER_API_KEY). Set these
      # when a *_BASE_URL above points to a provider that needs a different key.
      EMBEDDING_OPENAI_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      VISUAL_OPENAI_API_KEY: ${VISUAL_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      CHAT_OPENAI_API_KEY: ${CHAT_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      RETRIEVAL_RERANK_API_KEY: ${RETRIEVAL_RERANK_API_KEY:-${OPENAI_PROVIDER_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      VISUAL_BASE_URL: ${VISUAL_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      RETRIEVAL_RERANK_BASE_URL: ${RETRIEVAL_RERANK_BASE_URL:-${LLM_PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}}
      # Rerank provider selection (global, one setting for every KB/user):
      # "" or "openrouter" (default, Cohere-compatible /rerank) or "bedrock"
      # (Amazon Bedrock Rerank). With "bedrock", RETRIEVAL_RERANK_API_KEY is
      # ignored and credentials come from the standard AWS chain
      # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN, shared
      # config, or the workload IAM role).
      RETRIEVAL_RERANK_PROVIDER: ${RETRIEVAL_RERANK_PROVIDER:-}
      RETRIEVAL_RERANK_AWS_REGION: ${RETRIEVAL_RERANK_AWS_REGION:-}
      RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION: ${RETRIEVAL_RERANK_STRICT_STARTUP_VALIDATION:-false}
      RETRIEVAL_RERANK_ENFORCE_EU_REGION: ${RETRIEVAL_RERANK_ENFORCE_EU_REGION:-false}
      RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS: ${RETRIEVAL_RERANK_ALLOWED_AWS_REGIONS:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3.5-27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-baai/bge-m3}
      VISUAL_MODEL: ${VISUAL_MODEL:-qwen/qwen3-vl-32b-instruct}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
      # --- Task LLM (for extensions: extraction, classification, summarization) ---
      TASK_BASE_URL: ${TASK_BASE_URL:-}
      TASK_MODEL: ${TASK_MODEL:-}
      TASK_OPENAI_API_KEY: ${TASK_API_KEY:-}
      TASK_SYSTEM_PROMPT: ${TASK_SYSTEM_PROMPT:-}
      ENABLE_INTERNAL_PROFILER: ${ENABLE_INTERNAL_PROFILER:-true}
      LOG_LEVEL: ${CORE_LOG_LEVEL:-INFO}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-3}
      # --- GraphRAG ---
      GRAPH_ENABLED: ${GRAPH_ENABLED:-false}
      GRAPH_STORE_BACKEND: ${GRAPH_STORE_BACKEND:-sqlite}
      GRAPH_DEFAULT_RETRIEVAL_MODE: ${GRAPH_DEFAULT_RETRIEVAL_MODE:-vector}
      GRAPH_TRAVERSAL_MAX_DEPTH: ${GRAPH_TRAVERSAL_MAX_DEPTH:-2}
      GRAPH_TRAVERSAL_MAX_NODES: ${GRAPH_TRAVERSAL_MAX_NODES:-50}
      GRAPH_TRAVERSAL_MAX_EDGES: ${GRAPH_TRAVERSAL_MAX_EDGES:-100}
      GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD: ${GRAPH_EXTRACTION_CONFIDENCE_THRESHOLD:-0.5}
      # --- Retriva Pro extensions ---
      RETRIVA_EXTENSIONS: ${RETRIVA_EXTENSIONS:-}
      # --- Web Research: internal SearXNG (ADR-014) ---
      CRM_SEARXNG_URL: ${CRM_SEARXNG_URL:-http://retriva-searxng:8080}
      CRM_PUBLIC_RESEARCH_PROVIDER: ${CRM_PUBLIC_RESEARCH_PROVIDER:-searxng}
      # --- Session Document Processing ---
      SESSION_ATTACHMENT_MAX_SIZE: ${SESSION_ATTACHMENT_MAX_SIZE:-52428800}
      SESSION_ATTACHMENT_TTL_SECONDS: ${SESSION_ATTACHMENT_TTL_SECONDS:-86400}
      SESSION_ARTIFACT_TTL_SECONDS: ${SESSION_ARTIFACT_TTL_SECONDS:-172800}
    volumes:
      - retriva_core_storage:/app/storage
    depends_on:
      qdrant:
        condition: service_healthy
      tika:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Mandatory shared PostgreSQL: Core services start only after
      # successful Core migrations.
      retriva-pg-migrate:
        condition: service_completed_successfully
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; [sys.exit(0) for p in os.listdir('/proc') if p.isdigit() and p!=str(os.getpid()) and 'celery' in open(f'/proc/{p}/cmdline','rb').read().decode(errors='ignore').replace('\\x00',' ')] or sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  retriva-gateway:
    build:
      context: ${RETRIVA_GATEWAY_CONTEXT:-${RETRIVA_GATEWAY_DIR:-../retriva-gateway}}
      dockerfile: ${RETRIVA_GATEWAY_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_GATEWAY_BUILD_TARGET:-base}
    image: ${RETRIVA_GATEWAY_IMAGE:-retriva-gateway:local}
    container_name: retriva-gateway
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_CORE_INGESTION_URL: ${RETRIVA_CORE_INGESTION_URL:-http://retriva-ingestion:8000}
      RETRIVA_CORE_CHAT_URL: ${RETRIVA_CORE_CHAT_URL:-http://retriva-core:8001}
      # Browser-reachable origin for clickable review/report links the
      # chat agent emits (mirrors the WebUI's VITE gateway base URL).
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8002}}
      DYNAMIC_INGESTION_ENABLED: ${DYNAMIC_INGESTION_ENABLED:-true}
      GATEWAY_INTERNAL_SERVICE_TOKEN: ${GATEWAY_INTERNAL_SERVICE_TOKEN:-local-dev-service-token}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      STT_ENABLED: ${STT_ENABLED:-true}
      WHISPER_SERVER_URL: ${WHISPER_SERVER_URL:-http://whisper:${WHISPER_PORT:-8080}/inference}
      # --- Authentication ---
      RETRIVA_AUTH_PROVIDER: ${RETRIVA_AUTH_PROVIDER:-none}
      RETRIVA_AUTH_EXEMPT_PATHS: ${RETRIVA_AUTH_EXEMPT_PATHS:-/health,/ready,/capabilities}
      RETRIVA_ENTRA_TENANT_ID: ${RETRIVA_ENTRA_TENANT_ID:-}
      RETRIVA_ENTRA_AUDIENCE: ${RETRIVA_ENTRA_AUDIENCE:-}
      RETRIVA_ENTRA_ISSUER: ${RETRIVA_ENTRA_ISSUER:-}
      RETRIVA_ENTRA_REQUIRED_SCOPES: ${RETRIVA_ENTRA_REQUIRED_SCOPES:-[]}
      RETRIVA_ENTRA_ROLE_CLAIM: ${RETRIVA_ENTRA_ROLE_CLAIM:-roles}
      RETRIVA_ENTRA_GROUPS_CLAIM: ${RETRIVA_ENTRA_GROUPS_CLAIM:-groups}
      RETRIVA_ENTRA_JWKS_REFRESH_SECONDS: ${RETRIVA_ENTRA_JWKS_REFRESH_SECONDS:-3600}
      # Trusted machine-caller principal presented to the CRM extension
      # when auth is disabled (must match CRM_EXECUTOR_SERVICE_PRINCIPAL;
      # empty = legacy anonymous behavior).
      RETRIVA_SERVICE_PRINCIPAL: ${RETRIVA_SERVICE_PRINCIPAL:-${CRM_EXECUTOR_SERVICE_PRINCIPAL:-}}
      # Set false on deployments without the CRM PostgreSQL extension
      # (removes the 19 ACP/enrichment tool schemas from chat).
      AGENT_ACP_TOOLS_ENABLED: ${AGENT_ACP_TOOLS_ENABLED:-true}
      # --- Hybrid intent routing — classifier policy (Spec 001 Phase D).
      # Untrusted advisory classifier; mode off and streaming never invoke
      # it; the transport is Core's deployment-global configuration.
      AGENT_INTENT_CLASSIFIER_ENABLED: ${AGENT_INTENT_CLASSIFIER_ENABLED:-false}
      AGENT_INTENT_CLASSIFIER_MIN_CONFIDENCE: ${AGENT_INTENT_CLASSIFIER_MIN_CONFIDENCE:-0.85}
      AGENT_INTENT_CLASSIFIER_SAFE_WORKFLOW_MIN_CONFIDENCE: ${AGENT_INTENT_CLASSIFIER_SAFE_WORKFLOW_MIN_CONFIDENCE:-0.90}
      AGENT_INTENT_CLASSIFIER_MAX_INPUT_CHARS: ${AGENT_INTENT_CLASSIFIER_MAX_INPUT_CHARS:-2000}
      AGENT_INTENT_CLASSIFIER_MAX_CONTEXT_TURNS: ${AGENT_INTENT_CLASSIFIER_MAX_CONTEXT_TURNS:-4}
      AGENT_INTENT_CLASSIFIER_FAIL_MODE: ${AGENT_INTENT_CLASSIFIER_FAIL_MODE:-clarify}
      # Dedicated service credential (must equal Core's
      # INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN).
      AGENT_INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN: ${AGENT_INTENT_CLASSIFIER_SERVICE_AUTH_TOKEN:-}
    ports:
      - "${GATEWAY_PORT:-8002}:8002"
    volumes:
      - retriva_gateway_storage:/app/storage
    depends_on:
      retriva-core:
        condition: service_started
      # Mandatory shared PostgreSQL: Core services start only after
      # successful Core migrations.
      retriva-pg-migrate:
        condition: service_completed_successfully
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${GATEWAY_INTERNAL_PORT:-8002}/gateway/health || curl -fsS http://127.0.0.1:${GATEWAY_INTERNAL_PORT:-8002}/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --- Retriva Pro: internal SearXNG metasearch (ADR-014) ---
  # URL-discovery provider for Web Research.  Internal network only — no
  # published host port.  JSON output is required by SearxngSearchProvider;
  # the readiness probe treats a JSON-disabled instance as not ready.
  # SEARXNG_SECRET must be set in the env file (generate with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))" ).
  retriva-searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.9.11-61d660276}
    container_name: retriva-searxng
    restart: unless-stopped
    profiles: ["pro"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://retriva-searxng:8080}
      INSTANCE_NAME: ${SEARXNG_INSTANCE_NAME:-retriva-searxng}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - retriva-net
    # No `ports:` — deliberately not reachable from the host or public net.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  # --- Retriva Pro: MediaWiki Connectors ---
  # Each MediaWiki instance gets its own connector service with its own
  # config file, state volume, and env vars.  To add a new wiki:
  # 1. Create a config/mediawiki-<name>.yaml (copy from mediawiki.yaml)
  # 2. Add MEDIAWIKI_CONNECTOR_<N>_* vars to .env
  # 3. Uncomment and customize the retriva-mediawiki-connector-2 block below
  retriva-mediawiki-connector:
    build:
      context: ${RETRIVA_MEDIAWIKI_CONNECTOR_DIR:-../retriva-mediawiki-connector}
      dockerfile: ${RETRIVA_MEDIAWIKI_CONNECTOR_DOCKERFILE:-Dockerfile}
    image: ${RETRIVA_MEDIAWIKI_CONNECTOR_IMAGE:-retriva-mediawiki-connector:local}
    container_name: retriva-mediawiki-connector
    restart: "no"
    profiles: ["pro", "connectors"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://retriva-gateway:8002}
      RETRIVA_GATEWAY_BASE_URL: ${RETRIVA_GATEWAY_BASE_URL:-http://retriva-gateway:8002}
      GATEWAY_INTERNAL_SERVICE_TOKEN: ${GATEWAY_INTERNAL_SERVICE_TOKEN:-local-dev-service-token}
      MEDIAWIKI_CONNECTOR_API_URL: ${MEDIAWIKI_CONNECTOR_API_URL:-}
      MEDIAWIKI_CONNECTOR_AUTH_MODE: ${MEDIAWIKI_CONNECTOR_AUTH_MODE:-none}
      MEDIAWIKI_CONNECTOR_SOURCE_ID: ${MEDIAWIKI_CONNECTOR_SOURCE_ID:-src_local_mediawiki}
      MEDIAWIKI_CONNECTOR_TARGET_KB_ID: ${MEDIAWIKI_CONNECTOR_TARGET_KB_ID:-default}
      MEDIAWIKI_CONNECTOR_COLLECTION: ${MEDIAWIKI_CONNECTOR_COLLECTION:-}
      MEDIAWIKI_CONNECTOR_KB_IDS: ${MEDIAWIKI_CONNECTOR_KB_IDS:-}
      MEDIAWIKI_CONNECTOR_TAG: ${MEDIAWIKI_CONNECTOR_TAG:-}
      MEDIAWIKI_CONNECTOR_PUBLIC_URL: ${MEDIAWIKI_CONNECTOR_PUBLIC_URL:-http://localhost:${INGESTION_PORT:-8000}/api.php}
      MEDIAWIKI_USERNAME: ${MEDIAWIKI_CONNECTOR_USERNAME:-}
      MEDIAWIKI_BOT_PASSWORD: ${MEDIAWIKI_CONNECTOR_BOT_PASSWORD:-}
      MEDIAWIKI_CONFIG: /app/config/mediawiki.yaml
      LOCAL_STATE_STORE_PATH: /app/state/mediawiki-connector-cache.sqlite
    volumes:
      - ./config/mediawiki.yaml:/app/config/mediawiki.yaml:ro
      - mediawiki_connector_state:/app/state
    depends_on:
      retriva-gateway:
        condition: service_healthy
      mediawiki-local:
        condition: service_healthy
    networks:
      - retriva-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ${MEDIAWIKI_CONNECTOR_COMMAND:-daemon}

  # Template for a second MediaWiki connector.
  # Uncomment and customize to sync a second wiki.
  # retriva-mediawiki-connector-2:
  #   build:
  #     context: ${RETRIVA_MEDIAWIKI_CONNECTOR_DIR:-../retriva-mediawiki-connector}
  #     dockerfile: ${RETRIVA_MEDIAWIKI_CONNECTOR_DOCKERFILE:-Dockerfile}
  #   image: ${RETRIVA_MEDIAWIKI_CONNECTOR_IMAGE:-retriva-mediawiki-connector:local}
  #   container_name: retriva-mediawiki-connector-2
  #   restart: "no"
  #   profiles: ["pro", "connectors"]
  #   env_file:
  #     - ${ENV_FILE:-.env}
  #   environment:
  #     TZ: ${TZ:-UTC}
  #     GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://retriva-gateway:8002}
  #     RETRIVA_GATEWAY_BASE_URL: ${RETRIVA_GATEWAY_BASE_URL:-http://retriva-gateway:8002}
  #     GATEWAY_INTERNAL_SERVICE_TOKEN: ${GATEWAY_INTERNAL_SERVICE_TOKEN:-local-dev-service-token}
  #     MEDIAWIKI_CONNECTOR_API_URL: ${MEDIAWIKI_CONNECTOR_2_API_URL:-}
  #     MEDIAWIKI_CONNECTOR_AUTH_MODE: ${MEDIAWIKI_CONNECTOR_2_AUTH_MODE:-none}
  #     MEDIAWIKI_CONNECTOR_SOURCE_ID: ${MEDIAWIKI_CONNECTOR_2_SOURCE_ID:-src_mediawiki_2}
  #     MEDIAWIKI_CONNECTOR_TARGET_KB_ID: ${MEDIAWIKI_CONNECTOR_2_TARGET_KB_ID:-default}
  #     MEDIAWIKI_CONNECTOR_TAG: ${MEDIAWIKI_CONNECTOR_2_TAG:-}
  #     MEDIAWIKI_CONNECTOR_PUBLIC_URL: ${MEDIAWIKI_CONNECTOR_2_PUBLIC_URL:-}
  #     MEDIAWIKI_USERNAME: ${MEDIAWIKI_CONNECTOR_2_USERNAME:-}
  #     MEDIAWIKI_BOT_PASSWORD: ${MEDIAWIKI_CONNECTOR_2_BOT_PASSWORD:-}
  #     MEDIAWIKI_CONFIG: /app/config/mediawiki-2.yaml
  #     LOCAL_STATE_STORE_PATH: /app/state/mediawiki-connector-cache.sqlite
  #   volumes:
  #     - ./config/mediawiki-2.yaml:/app/config/mediawiki-2.yaml:ro
  #     - mediawiki_connector_2_state:/app/state
  #   depends_on:
  #     retriva-gateway:
  #       condition: service_healthy
  #   networks:
  #     - retriva-net
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   command: ${MEDIAWIKI_CONNECTOR_2_COMMAND:-daemon}

  # --- Local-development MediaWiki dependency for the MediaWiki connector ---
  # A minimal, private, persistent MediaWiki used only for local-development
  # connector validation.  It is not published on any host port and is reachable
  # only from the `retriva-local-net` network as `mediawiki-local`, matching the
  # existing `MEDIAWIKI_CONNECTOR_API_URL` default
  # (`http://mediawiki-local:80/api.php`).  Its database is isolated from the
  # Retriva centralized PostgreSQL store.
  mediawiki-local-db:
    image: ${MEDIAWIKI_LOCAL_DB_IMAGE:-mariadb:11.4}
    container_name: mediawiki-local-db
    restart: unless-stopped
    profiles: ["pro", "connectors"]
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${MEDIAWIKI_LOCAL_DB_NAME:-mediawiki_local}
      MARIADB_USER: ${MEDIAWIKI_LOCAL_DB_USER:-mediawiki}
      MARIADB_PASSWORD: ${MEDIAWIKI_LOCAL_DB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MEDIAWIKI_LOCAL_DB_ROOT_PASSWORD:-}
    volumes:
      - mediawiki_local_db_data:/var/lib/mysql
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mediawiki-local:
    image: ${MEDIAWIKI_LOCAL_IMAGE:-mediawiki:1.43.11}
    container_name: mediawiki-local
    restart: unless-stopped
    profiles: ["pro", "connectors"]
    depends_on:
      mediawiki-local-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      MW_DB_HOST: mediawiki-local-db
      MW_DB_NAME: ${MEDIAWIKI_LOCAL_DB_NAME:-mediawiki_local}
      MW_DB_USER: ${MEDIAWIKI_LOCAL_DB_USER:-mediawiki}
      MW_DB_PASSWORD: ${MEDIAWIKI_LOCAL_DB_PASSWORD:-}
      MW_ADMIN_USER: ${MEDIAWIKI_LOCAL_ADMIN_USER:-retriva_admin}
      MW_ADMIN_PASSWORD: ${MEDIAWIKI_LOCAL_ADMIN_PASSWORD:-}
      MW_SERVER: ${MEDIAWIKI_LOCAL_SERVER:-http://mediawiki-local}
      MW_SITE_NAME: ${MEDIAWIKI_LOCAL_SITE_NAME:-Retriva Local Wiki}
    volumes:
      - mediawiki_local_config:/config
    networks:
      - retriva-net
    # One-time, non-interactive local-development initialization: install the
    # wiki into the persistent /config volume on first start, then symlink
    # LocalSettings.php into the web root and run Apache.  Credentials come only
    # from the environment (no secrets are written to the repository).
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          php -r 'exit(@mysqli_connect(getenv("MW_DB_HOST"),getenv("MW_DB_USER"),getenv("MW_DB_PASSWORD"),getenv("MW_DB_NAME"),3306)?0:1);' && break
          echo "waiting for mediawiki database ($$i)"; sleep 2
        done
        if [ ! -f /config/LocalSettings.php ]; then
          php /var/www/html/maintenance/install.php \
            --dbtype mysql --dbserver "$$MW_DB_HOST" --dbname "$$MW_DB_NAME" \
            --dbuser "$$MW_DB_USER" --dbpass "$$MW_DB_PASSWORD" \
            --pass "$$MW_ADMIN_PASSWORD" --server "$$MW_SERVER" \
            --scriptpath "" --lang en "$$MW_SITE_NAME" "$$MW_ADMIN_USER"
          cp -f /var/www/html/LocalSettings.php /config/LocalSettings.php
        fi
        cp -f /config/LocalSettings.php /var/www/html/LocalSettings.php
        chmod 644 /var/www/html/LocalSettings.php
        exec apache2-foreground
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost/api.php?action=query&meta=siteinfo&format=json' | grep -q '\"batchcomplete\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # --- Retriva Pro: Email Agent Connector ---
  # Runs a built-in SMTP server that receives emails sent to a Retriva-managed
  # address and ingests them via the Gateway.  Supports plus-addressed metadata:
  #   retriva+collection_name+kb+tag1+tag2@retriva-server.com
  # Messages are discarded after processing (no mailbox storage).
  # See ../retriva-email-agent-connector/README.md for details.
  retriva-email-agent-connector:
    build:
      context: ${RETRIVA_EMAIL_AGENT_CONNECTOR_DIR:-../retriva-email-agent-connector}
      dockerfile: ${RETRIVA_EMAIL_AGENT_CONNECTOR_DOCKERFILE:-Dockerfile}
    image: ${RETRIVA_EMAIL_AGENT_CONNECTOR_IMAGE:-retriva-email-agent-connector:local}
    container_name: retriva-email-agent-connector
    restart: unless-stopped
    profiles: ["pro", "connectors"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://retriva-gateway:8002}
      RETRIVA_GATEWAY_BASE_URL: ${RETRIVA_GATEWAY_BASE_URL:-http://retriva-gateway:8002}
      GATEWAY_INTERNAL_SERVICE_TOKEN: ${GATEWAY_INTERNAL_SERVICE_TOKEN:-local-dev-service-token}
      EMAIL_AGENT_CONNECTOR_TENANT_ID: ${EMAIL_AGENT_CONNECTOR_TENANT_ID:-local-dev}
      EMAIL_AGENT_CONNECTOR_SOURCE_ID: ${EMAIL_AGENT_CONNECTOR_SOURCE_ID:-src_local_email_agent}
      EMAIL_AGENT_CONNECTOR_TARGET_KB_ID: ${EMAIL_AGENT_CONNECTOR_TARGET_KB_ID:-default}
      EMAIL_AGENT_CONNECTOR_COLLECTION: ${EMAIL_AGENT_CONNECTOR_COLLECTION:-}
      EMAIL_AGENT_CONNECTOR_KB_IDS: ${EMAIL_AGENT_CONNECTOR_KB_IDS:-}
      EMAIL_AGENT_CONNECTOR_SMTP_HOST: ${EMAIL_AGENT_CONNECTOR_SMTP_HOST:-0.0.0.0}
      EMAIL_AGENT_CONNECTOR_SMTP_PORT: ${EMAIL_AGENT_CONNECTOR_SMTP_PORT:-8025}
      EMAIL_AGENT_CONNECTOR_SMTP_REQUIRE_TLS: ${EMAIL_AGENT_CONNECTOR_SMTP_REQUIRE_TLS:-false}
      EMAIL_AGENT_CONNECTOR_WAIT_FOR_JOB: ${EMAIL_AGENT_CONNECTOR_WAIT_FOR_JOB:-true}
      EMAIL_AGENT_CONNECTOR_JOB_POLL_INTERVAL_SECONDS: ${EMAIL_AGENT_CONNECTOR_JOB_POLL_INTERVAL_SECONDS:-2}
      EMAIL_AGENT_CONNECTOR_JOB_TIMEOUT_SECONDS: ${EMAIL_AGENT_CONNECTOR_JOB_TIMEOUT_SECONDS:-120}
      EMAIL_AGENT_CONNECTOR_ADDRESS_PREFIX: ${EMAIL_AGENT_CONNECTOR_ADDRESS_PREFIX:-retriva}
      EMAIL_AGENT_CONNECTOR_ADDRESS_DOMAIN: ${EMAIL_AGENT_CONNECTOR_ADDRESS_DOMAIN:-}
      EMAIL_AGENT_CONFIG: /app/config/email-agent.yaml
      EMAIL_AGENT_CONNECTOR_STATE_STORE_PATH: /app/state/email-agent-connector-cache.sqlite
    ports:
      - "${EMAIL_AGENT_SMTP_HOST_PORT:-127.0.0.1:8025}:${EMAIL_AGENT_CONNECTOR_SMTP_PORT:-8025}"
    volumes:
      - ./config/email-agent.yaml:/app/config/email-agent.yaml:ro
      - email_agent_connector_state:/app/state
    depends_on:
      retriva-gateway:
        condition: service_healthy
    networks:
      - retriva-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ${EMAIL_AGENT_CONNECTOR_COMMAND:-run}

  # --- Retriva Pro: Messaging Extension ---
  # Durable, asynchronous, multi-channel notifications.
  # Retriva Messaging is the system of record; Apprise API is a replaceable
  # delivery adapter.  See ../retriva-messaging-extension/README.md.
  #
  # NOTE (Spec 024; ADR-029): the retired dedicated Messaging
  # PostgreSQL service (`retriva-messaging-db`) and the
  # `retriva_messaging` database target were removed.  Messaging uses
  # the shared `retriva-postgres` service and the common `retriva`
  # database with the Pro-owned `messaging` schema; its role and
  # schema are provisioned by `retriva-pg-messaging-bootstrap` and its
  # Alembic stream by `retriva-pg-messaging-migrate`.

  apprise-api:
    image: ${APPRISE_API_IMAGE:-caronc/apprise:latest}
    container_name: retriva-apprise-api
    restart: unless-stopped
    profiles: ["pro", "messaging"]
    environment:
      TZ: ${TZ:-UTC}
      # Apprise API base URL as seen from the messaging container.
      APPRISE_API_URL: http://apprise-api:8000
    volumes:
      - apprise_config:/config
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  retriva-messaging:
    build:
      context: ${RETRIVA_MESSAGING_DIR:-../retriva-messaging-extension}
      dockerfile: ${RETRIVA_MESSAGING_DOCKERFILE:-Dockerfile}
    image: ${RETRIVA_MESSAGING_IMAGE:-retriva-messaging:local}
    container_name: retriva-messaging
    restart: unless-stopped
    profiles: ["pro", "messaging"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_MESSAGING_ENABLED: ${RETRIVA_MESSAGING_ENABLED:-true}
      RETRIVA_MESSAGING_HOST: 0.0.0.0
      RETRIVA_MESSAGING_PORT: ${MESSAGING_PORT:-8005}
      RETRIVA_MESSAGING_LOG_LEVEL: ${MESSAGING_LOG_LEVEL:-INFO}
      RETRIVA_MESSAGING_MODE: ${RETRIVA_MESSAGING_MODE:-global}
      RETRIVA_MESSAGING_ENABLED_CHANNELS: ${RETRIVA_MESSAGING_ENABLED_CHANNELS:-email}
      RETRIVA_MESSAGING_DEFAULT_CHANNELS: ${RETRIVA_MESSAGING_DEFAULT_CHANNELS:-email}
      RETRIVA_MESSAGING_ALLOW_ARBITRARY_DESTINATIONS: ${RETRIVA_MESSAGING_ALLOW_ARBITRARY_DESTINATIONS:-false}
      # Shared Retriva PostgreSQL service, `retriva` database,
      # Pro-owned `messaging` schema.  The runtime identity is the
      # dedicated `retriva_messaging` role (never the migrator or the
      # admin); migrations run through `retriva-pg-messaging-migrate`.
      # (manage.sh `messaging-*` commands fail fast when the runtime
      # credential is unset; the compose interpolation default stays
      # empty so non-messaging deployments validate cleanly.)
      RETRIVA_MESSAGING_DATABASE_URL: postgresql+psycopg2://${RETRIVA_MESSAGING_DB_USER:-retriva_messaging}:${RETRIVA_MESSAGING_DB_PASSWORD:-}@retriva-postgres:5432/${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_MESSAGING_APPRISE_API_URL: http://apprise-api:8000
      RETRIVA_MESSAGING_APPRISE_EMAIL_TAG: ${RETRIVA_MESSAGING_APPRISE_EMAIL_TAG:-retriva-email}
      RETRIVA_MESSAGING_EMAIL_FROM_ADDRESS: ${RETRIVA_MESSAGING_EMAIL_FROM_ADDRESS:-retriva@localhost}
      RETRIVA_MESSAGING_EMAIL_FROM_NAME: ${RETRIVA_MESSAGING_EMAIL_FROM_NAME:-Retriva}
      RETRIVA_MESSAGING_INTERNAL_SERVICE_TOKEN: ${RETRIVA_MESSAGING_INTERNAL_SERVICE_TOKEN:-}
      RETRIVA_MESSAGING_PER_USER_IDENTITY_AVAILABLE: ${RETRIVA_MESSAGING_PER_USER_IDENTITY_AVAILABLE:-false}
      RETRIVA_MESSAGING_CONFIG: /app/config/messaging.yaml
    ports:
      - "${MESSAGING_PORT:-8005}:8005"
    volumes:
      - ./config/messaging.yaml:/app/config/messaging.yaml:ro
      - messaging_state:/app/state
    depends_on:
      # Shared-PostgreSQL lifecycle: the Messaging service starts only
      # after its own migration stream succeeded (Core migrations
      # first, then the Messaging one-shot), never before.
      retriva-pg-messaging-migrate:
        condition: service_completed_successfully
      apprise-api:
        condition: service_healthy
    networks:
      - retriva-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MESSAGING_PORT:-8005}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  retriva-webui:
    build:
      context: ${RETRIVA_WEBUI_DIR:-../retriva-webui}
      dockerfile: ${RETRIVA_WEBUI_DOCKERFILE:-Dockerfile}
      args:
        VITE_RETRIVA_GATEWAY_BASE_URL: ${VITE_RETRIVA_GATEWAY_BASE_URL:-http://localhost:${GATEWAY_PORT:-8002}}
        VITE_RETRIVA_ENABLE_VOICE_INPUT: ${VITE_RETRIVA_ENABLE_VOICE_INPUT:-true}
        VITE_RETRIVA_AUTH_PROVIDER: ${VITE_RETRIVA_AUTH_PROVIDER:-none}
        VITE_RETRIVA_ENTRA_CLIENT_ID: ${VITE_RETRIVA_ENTRA_CLIENT_ID:-}
        VITE_RETRIVA_ENTRA_TENANT_ID: ${VITE_RETRIVA_ENTRA_TENANT_ID:-}
        VITE_RETRIVA_ENTRA_AUTHORITY: ${VITE_RETRIVA_ENTRA_AUTHORITY:-}
        VITE_RETRIVA_ENTRA_SCOPES: ${VITE_RETRIVA_ENTRA_SCOPES:-}
    image: ${RETRIVA_WEBUI_IMAGE:-retriva-webui:local}
    container_name: retriva-webui
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-UTC}
      VITE_RETRIVA_GATEWAY_BASE_URL: ${VITE_RETRIVA_GATEWAY_BASE_URL:-http://localhost:${GATEWAY_PORT:-8002}}
      RETRIVA_GATEWAY_BASE_URL: ${RETRIVA_GATEWAY_BASE_URL_FOR_WEBUI:-http://retriva-gateway:8002}
      VITE_SPEECH_INPUT_MODE: ${VITE_SPEECH_INPUT_MODE:-gateway}
      VITE_RETRIVA_ENABLE_VOICE_INPUT: ${VITE_RETRIVA_ENABLE_VOICE_INPUT:-true}
      VITE_RETRIVA_AUTH_PROVIDER: ${VITE_RETRIVA_AUTH_PROVIDER:-none}
      VITE_RETRIVA_ENTRA_CLIENT_ID: ${VITE_RETRIVA_ENTRA_CLIENT_ID:-}
      VITE_RETRIVA_ENTRA_TENANT_ID: ${VITE_RETRIVA_ENTRA_TENANT_ID:-}
      VITE_RETRIVA_ENTRA_AUTHORITY: ${VITE_RETRIVA_ENTRA_AUTHORITY:-}
      VITE_RETRIVA_ENTRA_SCOPES: ${VITE_RETRIVA_ENTRA_SCOPES:-}
    ports:
      - "${WEBUI_PORT:-5173}:5173"
    depends_on:
      retriva-gateway:
        condition: service_started
    networks:
      - retriva-net

  # ---------------------------------------------------------------------------
  # PostgreSQL Business Intelligence Database (Retriva Pro).
  #
  # PostgreSQL is the authoritative RELATIONAL store: canonical
  # organization identity, business facts, commercial roles,
  # lifecycle, qualification history, exclusions, ERP imports, and
  # audit.  It does NOT replace Qdrant (embeddings/retrieval) and is
  # not published to the host: it is reachable only inside the
  # retriva-net Docker network.
  #
  # Gated behind the "db" profile so base and "pro" deployments are
  # unaffected (each phase is independently deployable and reversible):
  #   ./scripts/manage.sh db-up
  # ---------------------------------------------------------------------------
  # Mandatory shared PostgreSQL (Spec 024; ADR-029): one instance,
  # one `retriva` database, module-owned schemas.  Never profile-gated
  # anymore — Core-only deployments start it too.  The volume holds
  # real development data; it is never recreated by the lifecycle.
  retriva-postgres:
    image: ${RETRIVA_PG_IMAGE:-postgres:16.15-alpine}
    container_name: retriva-postgres
    restart: unless-stopped
    volumes:
      - retriva_pg_data:/var/lib/postgresql/data
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${RETRIVA_PG_DATABASE:-retriva}
      POSTGRES_USER: ${RETRIVA_PG_ADMIN_USER:-retriva_admin}
      # Set exactly ONE of the two in .env (env value or a mounted
      # secret file).  Real credentials are never committed.
      POSTGRES_PASSWORD: ${RETRIVA_PG_ADMIN_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${RETRIVA_PG_ADMIN_PASSWORD_FILE:-}
    healthcheck:
      # No credentials in the health output: user and database names
      # only.
      test: ["CMD-SHELL", "pg_isready -U ${RETRIVA_PG_ADMIN_USER:-retriva_admin} -d ${RETRIVA_PG_DATABASE:-retriva}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - retriva-net

  # One-shot Core platform bootstrap (cluster-admin connection):
  # provisions the platform roles (migrator, Core runtime) and
  # restricts database CREATE to the migrator.  Long-running services
  # NEVER use the admin/superuser account.  Runs the Core-only `base`
  # image (no Pro package, no Pro credential).
  retriva-pg-bootstrap:
    build:
      # Repo-relative context: the Core-only `base` stage copies
      # repo-relative paths (src/, requirements.txt), unlike the
      # `pro` stage which copies workspace-parent-relative paths.
      # The platform one-shots must therefore always build from the
      # core repo context, even in Pro deployments that override
      # RETRIVA_CORE_CONTEXT to the workspace parent.
      context: ${RETRIVA_PG_TOOLS_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_PG_TOOLS_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_PG_BUILD_TARGET:-base}
    image: ${RETRIVA_CORE_BASE_IMAGE:-retriva-core-base:local}
    container_name: retriva-pg-bootstrap
    restart: "no"
    command: python -m retriva.infrastructure.postgres.migrate bootstrap
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_PG_HOST: retriva-postgres
      RETRIVA_PG_PORT: "5432"
      RETRIVA_PG_DATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_PG_SSLMODE: ${RETRIVA_PG_SSLMODE:-prefer}
      RETRIVA_PG_ADMIN_USER: ${RETRIVA_PG_ADMIN_USER:-retriva_admin}
      RETRIVA_PG_ADMIN_PASSWORD: ${RETRIVA_PG_ADMIN_PASSWORD:-}
      RETRIVA_PG_ADMIN_PASSWORD_FILE: ${RETRIVA_PG_ADMIN_PASSWORD_FILE:-}
      RETRIVA_PG_MIGRATOR_PASSWORD: ${RETRIVA_PG_MIGRATOR_PASSWORD:-}
      RETRIVA_PG_MIGRATOR_PASSWORD_FILE: ${RETRIVA_PG_MIGRATOR_PASSWORD_FILE:-}
      RETRIVA_PG_CORE_PASSWORD: ${RETRIVA_PG_CORE_PASSWORD:-}
      RETRIVA_PG_CORE_PASSWORD_FILE: ${RETRIVA_PG_CORE_PASSWORD_FILE:-}
    depends_on:
      retriva-postgres:
        condition: service_healthy
    networks:
      - retriva-net

  # One-shot controlled Core migration step (migrator role only):
  # applies the `core.platform` stream (Core schema + ledger).  Core
  # services start only after this succeeds.  Core-only by design: no
  # extension provider is registered here (the extension one-shots
  # apply their own streams after this one).  Runs the Core-only
  # `base` image.
  retriva-pg-migrate:
    build:
      # Repo-relative context (see retriva-pg-bootstrap).
      context: ${RETRIVA_PG_TOOLS_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_PG_TOOLS_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_PG_BUILD_TARGET:-base}
    image: ${RETRIVA_CORE_BASE_IMAGE:-retriva-core-base:local}
    container_name: retriva-pg-migrate
    restart: "no"
    command: python -m retriva.infrastructure.postgres.migrate upgrade
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_PG_HOST: retriva-postgres
      RETRIVA_PG_PORT: "5432"
      RETRIVA_PG_DATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_PG_SSLMODE: ${RETRIVA_PG_SSLMODE:-prefer}
      RETRIVA_PG_MIGRATOR_PASSWORD: ${RETRIVA_PG_MIGRATOR_PASSWORD:-}
      RETRIVA_PG_MIGRATOR_PASSWORD_FILE: ${RETRIVA_PG_MIGRATOR_PASSWORD_FILE:-}
    depends_on:
      retriva-postgres:
        condition: service_healthy
      retriva-pg-bootstrap:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # One-shot Pro CRM extension bootstrap (profiles: pro/db): the four
  # CRM extension roles (application, importer, readonly, pgAdmin
  # operator).  The platform roles come from the Core bootstrap; this
  # step runs after it and reuses the Core generic provisioning.
  retriva-pg-crm-bootstrap:
    build:
      context: ${RETRIVA_CORE_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_CORE_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_PG_CRM_BUILD_TARGET:-pro}
    image: ${RETRIVA_CORE_IMAGE:-retriva-core:local}
    container_name: retriva-pg-crm-bootstrap
    restart: "no"
    profiles: ["pro", "db"]
    command: python -m retriva_crm_assistant.postgres.migrate bootstrap-roles
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_PG_HOST: retriva-postgres
      RETRIVA_PG_PORT: "5432"
      RETRIVA_PG_DATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_PG_SSLMODE: ${RETRIVA_PG_SSLMODE:-prefer}
      RETRIVA_PG_ADMIN_USER: ${RETRIVA_PG_ADMIN_USER:-retriva_admin}
      RETRIVA_PG_ADMIN_PASSWORD: ${RETRIVA_PG_ADMIN_PASSWORD:-}
      RETRIVA_PG_ADMIN_PASSWORD_FILE: ${RETRIVA_PG_ADMIN_PASSWORD_FILE:-}
      CRM_PG_APPLICATION_PASSWORD: ${CRM_PG_APPLICATION_PASSWORD:-}
      CRM_PG_APPLICATION_PASSWORD_FILE: ${CRM_PG_APPLICATION_PASSWORD_FILE:-}
      CRM_PG_IMPORTER_PASSWORD: ${CRM_PG_IMPORTER_PASSWORD:-}
      CRM_PG_IMPORTER_PASSWORD_FILE: ${CRM_PG_IMPORTER_PASSWORD_FILE:-}
      CRM_PG_READONLY_PASSWORD: ${CRM_PG_READONLY_PASSWORD:-}
      CRM_PG_READONLY_PASSWORD_FILE: ${CRM_PG_READONLY_PASSWORD_FILE:-}
      CRM_PGADMIN_UI_OPERATOR_PASSWORD: ${CRM_PGADMIN_UI_OPERATOR_PASSWORD:-}
      CRM_PGADMIN_UI_OPERATOR_PASSWORD_FILE: ${CRM_PGADMIN_UI_OPERATOR_PASSWORD_FILE:-}
    depends_on:
      retriva-pg-bootstrap:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # One-shot controlled Pro CRM migration step (profiles: pro/db):
  # applies the `pro.crm` stream through the provider contract
  # (adopting the retired `audit.schema_migrations` history when
  # present).  Depends on the Core migrations; no Core service
  # depends on it.
  retriva-pg-crm-migrate:
    build:
      context: ${RETRIVA_CORE_CONTEXT:-${RETRIVA_CORE_DIR:-../retriva-core}}
      dockerfile: ${RETRIVA_CORE_DOCKERFILE:-Dockerfile}
      target: ${RETRIVA_PG_CRM_BUILD_TARGET:-pro}
    image: ${RETRIVA_CORE_IMAGE:-retriva-core:local}
    container_name: retriva-pg-crm-migrate
    restart: "no"
    profiles: ["pro", "db"]
    command: python -m retriva_crm_assistant.postgres.migrate upgrade
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_PG_HOST: retriva-postgres
      RETRIVA_PG_PORT: "5432"
      RETRIVA_PG_DATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_PG_SSLMODE: ${RETRIVA_PG_SSLMODE:-prefer}
      # The migration step runs ONLY with the migrator credential
      # (extension role passwords never enter this container).
      RETRIVA_PG_MIGRATOR_PASSWORD: ${RETRIVA_PG_MIGRATOR_PASSWORD:-}
      RETRIVA_PG_MIGRATOR_PASSWORD_FILE: ${RETRIVA_PG_MIGRATOR_PASSWORD_FILE:-}
    depends_on:
      retriva-pg-migrate:
        condition: service_completed_successfully
      retriva-pg-crm-bootstrap:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # One-shot Messaging bootstrap (profiles: pro/messaging): the
  # `retriva_messaging` runtime role and the Pro-owned `messaging`
  # schema grants on the shared `retriva` database.
  retriva-pg-messaging-bootstrap:
    build:
      context: ${RETRIVA_MESSAGING_DIR:-../retriva-messaging-extension}
      dockerfile: ${RETRIVA_MESSAGING_DOCKERFILE:-Dockerfile}
    image: ${RETRIVA_MESSAGING_IMAGE:-retriva-messaging:local}
    container_name: retriva-pg-messaging-bootstrap
    restart: "no"
    profiles: ["pro", "messaging"]
    command: python scripts/bootstrap_postgres.py
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_PG_HOST: retriva-postgres
      RETRIVA_PG_PORT: "5432"
      RETRIVA_PG_DATABASE: ${RETRIVA_PG_DATABASE:-retriva}
      RETRIVA_PG_SSLMODE: ${RETRIVA_PG_SSLMODE:-prefer}
      RETRIVA_PG_ADMIN_USER: ${RETRIVA_PG_ADMIN_USER:-retriva_admin}
      RETRIVA_PG_ADMIN_PASSWORD: ${RETRIVA_PG_ADMIN_PASSWORD:-}
      RETRIVA_PG_ADMIN_PASSWORD_FILE: ${RETRIVA_PG_ADMIN_PASSWORD_FILE:-}
      RETRIVA_PG_MIGRATOR_USER: ${RETRIVA_PG_MIGRATOR_USER:-retriva_migrator}
      RETRIVA_MESSAGING_DB_USER: ${RETRIVA_MESSAGING_DB_USER:-retriva_messaging}
      RETRIVA_MESSAGING_DB_PASSWORD: ${RETRIVA_MESSAGING_DB_PASSWORD:-}
      RETRIVA_MESSAGING_DB_PASSWORD_FILE: ${RETRIVA_MESSAGING_DB_PASSWORD_FILE:-}
    depends_on:
      retriva-pg-bootstrap:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # One-shot Messaging migration step (profiles: pro/messaging):
  # applies Messaging's Alembic stream to the shared `retriva`
  # database's `messaging` schema, as the migrator identity (the
  # runtime role cannot run schema DDL).
  retriva-pg-messaging-migrate:
    build:
      context: ${RETRIVA_MESSAGING_DIR:-../retriva-messaging-extension}
      dockerfile: ${RETRIVA_MESSAGING_DOCKERFILE:-Dockerfile}
    image: ${RETRIVA_MESSAGING_IMAGE:-retriva-messaging:local}
    container_name: retriva-pg-messaging-migrate
    restart: "no"
    profiles: ["pro", "messaging"]
    command: migrate
    environment:
      TZ: ${TZ:-UTC}
      RETRIVA_MESSAGING_DATABASE_URL: postgresql+psycopg2://${RETRIVA_PG_MIGRATOR_USER:-retriva_migrator}:${RETRIVA_PG_MIGRATOR_PASSWORD:-}@retriva-postgres:5432/${RETRIVA_PG_DATABASE:-retriva}
    depends_on:
      retriva-pg-migrate:
        condition: service_completed_successfully
      retriva-pg-messaging-bootstrap:
        condition: service_completed_successfully
    networks:
      - retriva-net

  # pgAdmin for authorized operators (inspect/query/debug).  Binds to
  # localhost by default; remote access requires an SSH tunnel, VPN,
  # or an authenticated internal route.  Connect to PostgreSQL via
  # the internal Docker hostname "retriva-postgres" (port 5432) using
  # the retriva_pgadmin_operator role.
  retriva-pgadmin:
    image: ${RETRIVA_PGADMIN_IMAGE:-dpage/pgadmin4:9.18}
    container_name: retriva-pgadmin
    restart: unless-stopped
    profiles: ["db", "pgadmin"]
    ports:
      - "${RETRIVA_PGADMIN_BIND_ADDR:-127.0.0.1}:${RETRIVA_PGADMIN_PORT:-5050}:80"
    volumes:
      - retriva_pgadmin_data:/var/lib/pgadmin
      # Pre-registered internal server definition (no credentials).
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    environment:
      TZ: ${TZ:-UTC}
      # Optional: defaults to ops@example.com when unset. Must be a
      # valid, non-reserved domain (pgAdmin rejects e.g. .local).
      PGADMIN_DEFAULT_EMAIL: ${RETRIVA_PGADMIN_UI_EMAIL:-ops@example.com}
      # Set exactly ONE of the two in .env.
      PGADMIN_DEFAULT_PASSWORD: ${RETRIVA_PGADMIN_UI_PASSWORD:-}
      PGADMIN_DEFAULT_PASSWORD_FILE: ${RETRIVA_PGADMIN_UI_PASSWORD_FILE:-}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      retriva-postgres:
        condition: service_healthy
    networks:
      - retriva-net
